<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport meta is the key to mobile-first rendering.
    width=device-width  — match the physical screen width
    initial-scale=1     — do not zoom out on first load
    user-scalable=no    — prevent accidental pinch-zoom on elderly users
                          (accessibility trade-off: pinch-zoom helps
                           visually impaired, but our font is already large)
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a237e" />
  <meta name="description"  content="कपड़ा दुकान का हिसाब-किताब" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <!-- iOS home screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="खाता" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <title>खाता</title>

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div id="app">

    <!-- ── Header (persistent across all screens) ─────────────── -->
    <header class="header">
      <div>
        <div class="header-title" id="header-title">खाता</div>
        <div class="header-sub"   id="header-sub"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="btn-admin-nav" class="badge-admin" style="display:none;border:none;border-radius:8px;cursor:pointer;font-weight:700;">⚙️ एडमिन</button>
        <button class="btn-logout" id="btn-logout" style="display:none">लॉगआउट</button>
      </div>
    </header>

    <!-- ── Screen content (swapped by app.js) ─────────────────── -->
    <main id="main">
      <!-- Loading state before JS runs -->
      <div class="spinner"></div>
    </main>

  </div>

  <!-- Fullscreen Photo Modal -->
  <div id="photo-modal" class="modal-overlay" style="display:none">
    <img id="photo-modal-img" class="modal-img" src="" alt="रसीद" />
    <button id="photo-modal-close" class="modal-close-btn">✕ बंद करें</button>
  </div>

  <!-- Floating Mic FAB (Permanent Global Voice Assistant) -->
  <button id="fab-mic" aria-label="आवाज़ से बोलें" title="आवाज़ से बोलें">🎤</button>

  <!-- Full-screen Voice Overlay (shown while listening / confirming) -->
  <div id="voice-overlay" class="hidden">
    <div class="voice-overlay-mic">🎤</div>
    <div class="voice-overlay-title" id="vo-title">बोलिए…</div>
    <div class="voice-overlay-transcript" id="vo-transcript"></div>
    <div class="voice-overlay-hint" id="vo-hint"></div>
    <!-- Voice confirm card (injected by JS after intent parsed) -->
    <div id="vo-confirm-area"></div>
    <button class="voice-overlay-close" id="vo-close">✕ रद्द करें</button>
  </div>

  <!-- Toast notification (outside #app so it layers above everything) -->
  <div id="toast"></div>

  <!--
    Script loading order matters:
      1. strings.js  — defines window.S (all Hindi text)
      2. app.js      — uses window.S, so must come after
  -->
  <script src="/strings.js"></script>
  <script src="/app.js"></script>
</body>
</html>
